<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <clipPath id="c"><rect width="64" height="64" rx="15"/></clipPath>
    <radialGradient id="lift" cx="48%" cy="22%" r="58%" fx="48%" fy="22%">
      <stop offset="0" stop-color="hsl(176 50% 15%)"/>
      <stop offset="1" stop-color="hsl(176 50% 15%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="memory" cx="26%" cy="104%" r="62%">
      <stop offset="0" stop-color="hsl(152 62% 20%)"/>
      <stop offset="1" stop-color="hsl(152 62% 20%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ray" cx="74%" cy="30%" r="50%">
      <stop offset="0" stop-color="hsl(182 65% 12%)" stop-opacity=".9"/>
      <stop offset="1" stop-color="hsl(182 65% 12%)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="edge" cx="50%" cy="46%" r="72%">
      <stop offset=".55" stop-color="hsl(180 60% 1%)" stop-opacity="0"/>
      <stop offset="1" stop-color="hsl(180 60% 1%)" stop-opacity=".85"/>
    </radialGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="hsl(162 45% 72%)" stop-opacity=".95"/>
      <stop offset=".55" stop-color="hsl(162 45% 70%)" stop-opacity=".4"/>
      <stop offset="1" stop-color="hsl(162 45% 70%)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="50%" r="60%">
      <stop offset="0" stop-color="hsl(162 55% 62%)" stop-opacity=".35"/>
      <stop offset="1" stop-color="hsl(162 55% 62%)" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 .92  0 0 0 0 .95  0 0 0 0 .94  0 0 0 .05 0"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="hsl(176 80% 3.2%)"/>
    <rect width="64" height="64" fill="url(#lift)"/>
    <rect width="64" height="64" fill="url(#memory)"/>
    <rect width="64" height="64" fill="url(#ray)"/>
    <rect width="64" height="64" fill="url(#edge)"/>
    <rect width="64" height="64" filter="url(#grain)"/>
    <rect x="12" y="36" width="32" height="10" fill="url(#glow)" filter="url(#soft)"/>
    <rect x="14" y="40.5" width="36" height="1.6" fill="url(#line)"/>
  </g>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="hsl(165 40% 90%)" stroke-opacity=".14"/>
</svg>
